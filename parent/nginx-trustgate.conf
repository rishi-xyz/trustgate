# TrustGate origin behind Cloudflare (installed as /etc/nginx/conf.d/trustgate.conf).
#
# Traffic arrives from Cloudflare over HTTPS on 443 (SSL/TLS mode "Full (strict)",
# using a Cloudflare Origin CA certificate). A request is served only if BOTH:
#   1. its TCP peer is one of Cloudflare's published edge addresses, and
#   2. it carries the secret header X-Origin-Verify, which a Cloudflare request
#      header rule adds. Without (2) any other Cloudflare customer could send
#      requests to this origin from the same address ranges.
# Rate limits use the real visitor address from CF-Connecting-IP, which is
# trusted only when the peer is a Cloudflare edge. This nginx is for
# availability and hygiene, not confidentiality: it sees the traffic the parent
# instance always could.

# A 64-character key does not fit nginx's default 64-byte map bucket ("could not
# build map_hash"), so raise it. It must come before the first map block.
map_hash_bucket_size 128;

# Generated by update-cloudflare-ips.sh: real_ip_header, set_real_ip_from and
# $tg_from_cloudflare.
include /etc/nginx/trustgate-cloudflare.conf;

# The secret header value is filled in by install.sh from /etc/trustgate/origin-secret.
map $http_x_origin_verify $tg_origin_ok {
    default            0;
    "__ORIGIN_SECRET__" 1;
}

# After the real_ip module runs, $binary_remote_addr is the visitor, not Cloudflare.
limit_req_zone  $binary_remote_addr zone=tg_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=tg_conn:10m;

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_tokens off;

    ssl_certificate     /etc/trustgate/origin.crt;
    ssl_certificate_key /etc/trustgate/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:tg_ssl:10m;
    ssl_session_timeout 10m;

    # Keep the body cap in step with the enclave's -max-body-mb (4 MiB).
    client_max_body_size    4m;
    client_header_timeout   10s;
    client_body_timeout     15s;
    keepalive_timeout       30s;
    send_timeout            60s;

    if ($tg_from_cloudflare = 0) { return 403; }
    if ($tg_origin_ok = 0)       { return 403; }

    location / {
        limit_req        zone=tg_rate burst=30 nodelay;
        limit_req_status 429;
        limit_conn       tg_conn 8;
        limit_conn_status 429;

        proxy_pass         http://127.0.0.1:8444;   # vsock-forwarder -> enclave
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_buffering    off;
        proxy_connect_timeout 3s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

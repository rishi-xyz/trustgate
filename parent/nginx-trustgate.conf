# TrustGate public origin (installed as /etc/nginx/conf.d/trustgate.conf).
#
# Only CloudFront should reach this port: the security group allows the
# CloudFront origin-facing prefix list, and CloudFront adds a secret header that
# is checked here, so someone else's CloudFront distribution cannot use this
# origin to bypass the WAF. This nginx is for availability and hygiene, not
# confidentiality: it sees the same traffic the parent instance always could.

# A 64-character key does not fit nginx's default 64-byte map bucket ("could not
# build map_hash"), so raise it.
map_hash_bucket_size 128;

# CloudFront puts the real viewer address in CloudFront-Viewer-Address ("ip:port",
# IPv6 as "2001:db8::1:port"). It is only trustworthy because of the secret-header check below.
map $http_cloudfront_viewer_address $tg_viewer {
    "~^(?<addr>.+):\d+$" $addr;
    default              $remote_addr;
}

# The secret header value is filled in by install.sh from /etc/trustgate/origin-secret.
map $http_x_origin_verify $tg_origin_ok {
    default            0;
    "__ORIGIN_SECRET__" 1;
}

limit_req_zone  $tg_viewer zone=tg_rate:10m rate=10r/s;
limit_conn_zone $tg_viewer zone=tg_conn:10m;

server {
    listen 8443 default_server;
    server_tokens off;

    # Keep the body cap in step with the enclave's -max-body-mb (4 MiB).
    client_max_body_size    4m;
    client_header_timeout   10s;
    client_body_timeout     15s;
    keepalive_timeout       30s;
    send_timeout            60s;

    if ($tg_origin_ok = 0) { return 403; }

    location / {
        limit_req        zone=tg_rate burst=30 nodelay;
        limit_req_status 429;
        limit_conn       tg_conn 8;
        limit_conn_status 429;

        proxy_pass         http://127.0.0.1:8444;   # vsock-forwarder -> enclave
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_buffering    off;
        proxy_connect_timeout 3s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;   # CloudFront gives up on the origin after 60 s
    }
}
